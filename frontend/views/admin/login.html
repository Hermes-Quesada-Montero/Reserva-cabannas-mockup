<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrador | Cabañas Los Pinos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { background: linear-gradient(135deg, #0d1f05 0%, #1a3009 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .login-card { background: white; border-radius: 16px; padding: 3rem; max-width: 420px; width: 100%; box-shadow: 0 25px 60px rgba(0,0,0,0.4); }
    .admin-badge { background: rgba(200,169,81,0.15); border: 1px solid rgba(200,169,81,0.4); color: #8B6914; padding: 0.3rem 0.8rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div id="page-loader"><div class="loader-logo">🌲</div><div class="loader-spinner"></div></div>
  <div class="login-card">
    <div style="text-align:center; margin-bottom:2.5rem">
      <div style="font-size:2.5rem; margin-bottom:0.75rem">🔐</div>
      <div class="admin-badge">Panel de Administración</div>
      <h1 style="font-size:1.6rem; color:var(--primary); margin-bottom:0.25rem">Cabañas Los Pinos</h1>
      <p style="color:var(--text-muted); font-size:0.85rem">Acceso exclusivo para administradores</p>
    </div>

    <div id="err-box" class="hidden" style="background:#fee2e2; border-radius:8px; padding:0.75rem 1rem; margin-bottom:1.25rem; font-size:0.875rem; color:#dc2626; border-left:3px solid #dc2626"></div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label">Usuario o Correo</label>
        <input type="text" id="identifier" class="form-control" placeholder="admin123" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <div style="position:relative">
          <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" id="toggle-pw" style="position:absolute; right:1rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:0.8rem">Ver</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.85rem; font-size:1rem; margin-top:0.5rem" id="btn-login">
        <span class="btn-text">Acceder al Panel</span>
      </button>
    </form>

    <p style="text-align:center; margin-top:1.5rem; font-size:0.8rem; color:var(--text-muted)">
      <a href="/" style="color:var(--primary)">← Volver al sitio público</a>
      &nbsp;·&nbsp;
      <a href="/login" style="color:var(--text-muted)">Acceso clientes</a>
    </p>
  </div>

  <script src="/js/main.js"></script>
  <script>
    // Verificar si ya es admin
    Auth.check().then(loggedIn => {
      if (loggedIn && Auth.user?.rol === 'admin') {
        window.location.href = '/admin/dashboard';
      }
    });

    document.getElementById('toggle-pw').addEventListener('click', () => {
      const input = document.getElementById('password');
      const btn   = document.getElementById('toggle-pw');
      input.type  = input.type === 'password' ? 'text' : 'password';
      btn.textContent = input.type === 'password' ? 'Ver' : 'Ocultar';
    });

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn    = document.getElementById('btn-login');
      const errBox = document.getElementById('err-box');
      btn.disabled = true; btn.classList.add('btn-loading');
      errBox.classList.add('hidden');

      try {
        const res = await API.post('/api/auth/login', {
          identifier: document.getElementById('identifier').value.trim(),
          password:   document.getElementById('password').value
        });

        if (res.success && res.user?.rol === 'admin') {
          window.location.href = '/admin/dashboard';
        } else if (res.success && res.user?.rol !== 'admin') {
          errBox.textContent = 'Esta cuenta no tiene permisos de administrador.';
          errBox.classList.remove('hidden');
          await API.post('/api/auth/logout', {});
          btn.disabled = false; btn.classList.remove('btn-loading');
        } else {
          errBox.textContent = res.message || 'Credenciales incorrectas.';
          errBox.classList.remove('hidden');
          btn.disabled = false; btn.classList.remove('btn-loading');
        }
      } catch {
        errBox.textContent = 'Error de conexión. Intente nuevamente.';
        errBox.classList.remove('hidden');
        btn.disabled = false; btn.classList.remove('btn-loading');
      }
    });
  </script>
</body>
</html>
