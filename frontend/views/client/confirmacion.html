<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación | Cabañas Los Pinos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .confirm-page { background:var(--bg); min-height:100vh; padding-top:var(--nav-height); display:flex; align-items:center; justify-content:center; padding:calc(var(--nav-height) + 2rem) 1rem 3rem; }
    .confirm-card { background:white; border-radius:var(--radius-lg); padding:3rem; max-width:680px; width:100%; box-shadow:var(--shadow-xl); border:1px solid var(--border); }
    .confirm-icon { width:80px; height:80px; background:rgba(39,174,96,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 1.5rem; font-size:2.5rem; }
    .confirm-pending .confirm-icon { background:rgba(243,156,18,0.1); }
    .qr-wrapper { background:var(--bg); border-radius:var(--radius); padding:1.5rem; text-align:center; border:1px solid var(--border); margin:1.5rem 0; }
    .actions-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.75rem; margin-top:1.5rem; }
    @media(max-width:600px){ .actions-grid { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
  <div id="page-loader"><div class="loader-logo">🌲</div><div class="loader-spinner"></div></div>
  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo"><svg viewBox="0 0 40 40"><path d="M20 4 L36 30 L4 30 Z" opacity="0.9" fill="currentColor"/><rect x="17" y="30" width="6" height="6" rx="1" fill="currentColor"/></svg>Cabañas <span>Los Pinos</span></a>
      <div class="nav-links"><a href="/cabanas">Cabañas</a><div id="nav-user" class="nav-user-menu"><button class="nav-user-btn" id="nav-user-btn"><div class="avatar" id="nav-avatar">U</div><span id="nav-user-name">Usuario</span></button><div class="nav-dropdown" id="nav-dropdown"><a href="/mi-cuenta">Mi Cuenta</a><hr><a href="#" id="nav-logout">Cerrar Sesión</a></div></div></div>
    </div>
  </nav>

  <div class="confirm-page">
    <div class="confirm-card" id="confirm-card">
      <div style="text-align:center; padding:2rem; color:var(--text-muted)">
        <div class="loader-spinner" style="margin:0 auto 1rem; width:44px; height:44px"></div>
        Cargando confirmación...
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    const reservacionId = window.location.pathname.split('/').pop();

    Auth.check().then(loggedIn => {
      if (!loggedIn) { window.location.href = '/login'; }
      else loadConfirmacion();
    });

    async function loadConfirmacion() {
      try {
        const res = await API.get(`/api/reservaciones/${reservacionId}`);
        if (!res.success) { Toast.error('No se pudo cargar la confirmación'); return; }
        const r = res.data;

        const isPending  = r.estado === 'pendiente';
        const isConfirmed = ['confirmada','completada'].includes(r.estado);

        document.getElementById('confirm-card').innerHTML = `
          <div style="text-align:center; margin-bottom:2rem">
            <div class="confirm-icon ${isPending ? 'confirm-pending' : ''}">
              ${isConfirmed ? '✅' : isPending ? '⏳' : '📋'}
            </div>
            <h2 style="margin-bottom:0.5rem; color:${isConfirmed ? 'var(--success)' : isPending ? 'var(--warning)' : 'var(--primary)'}">
              ${isConfirmed ? '¡Reservación Confirmada!' : isPending ? 'Reservación Pendiente' : 'Reservación Registrada'}
            </h2>
            <p style="color:var(--text-muted); max-width:460px; margin:0 auto">
              ${isConfirmed
                ? 'Tu reservación ha sido confirmada y está lista. Te esperamos en Cabañas Los Pinos.'
                : 'Tu reservación fue registrada. El pago se procesará al momento del check-in o al recibir confirmación.'}
            </p>
          </div>

          <div style="background:var(--bg); border-radius:var(--radius); padding:1.5rem; border:1px solid var(--border); margin-bottom:1.5rem">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem">
              <div>
                <div style="font-size:0.78rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px">Número de reservación</div>
                <div style="font-family:var(--font); font-size:1.4rem; font-weight:700; color:var(--primary)">${r.numero_reserva}</div>
              </div>
              ${Format.estado(r.estado)}
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; font-size:0.875rem">
              <div><span style="color:var(--text-muted)">Cabaña:</span> <strong>${r.cabana_nombre}</strong></div>
              <div><span style="color:var(--text-muted)">Noches:</span> <strong>${r.num_noches}</strong></div>
              <div><span style="color:var(--text-muted)">Check-in:</span> <strong>${Format.date(r.fecha_entrada)}</strong></div>
              <div><span style="color:var(--text-muted)">Check-out:</span> <strong>${Format.date(r.fecha_salida)}</strong></div>
              <div><span style="color:var(--text-muted)">Hora entrada:</span> <strong>1:00 PM</strong></div>
              <div><span style="color:var(--text-muted)">Hora salida:</span> <strong>12:00 PM</strong></div>
              <div><span style="color:var(--text-muted)">Total pagado:</span> <strong style="color:var(--primary)">$${r.total} USD</strong></div>
              <div><span style="color:var(--text-muted)">Método:</span> <strong>${r.metodo_pago || 'Pendiente'}</strong></div>
            </div>
          </div>

          ${r.codigo_qr ? `
            <div class="qr-wrapper">
              <div style="font-size:0.8rem; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin-bottom:0.75rem">Código QR de Verificación</div>
              <img src="${r.codigo_qr}" alt="QR de reservación" style="max-width:160px; margin:0 auto; border-radius:8px">
              <p style="font-size:0.78rem; color:var(--text-muted); margin-top:0.5rem">Presenta este código al hacer check-in</p>
            </div>
          ` : ''}

          <div class="actions-grid">
            <a href="/api/reservaciones/${reservacionId}/pdf" class="btn btn-outline-primary btn-sm" style="justify-content:center" target="_blank">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              Descargar PDF
            </a>
            <a href="/api/reservaciones/${reservacionId}/ics" class="btn btn-outline-primary btn-sm" style="justify-content:center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              Agregar Calendario
            </a>
            <a href="/mi-cuenta/reservaciones" class="btn btn-primary btn-sm" style="justify-content:center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
              Mis Reservaciones
            </a>
          </div>

          <div style="text-align:center; margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--border)">
            <p style="color:var(--text-muted); font-size:0.875rem; margin-bottom:1rem">¿Necesitas ayuda? Contáctanos</p>
            <div style="display:flex; justify-content:center; gap:1rem; flex-wrap:wrap">
              <a href="tel:+50622223333" style="color:var(--primary); font-size:0.875rem">📞 +506 2222-3333</a>
              <a href="mailto:info@cabanaslospinos.com" style="color:var(--primary); font-size:0.875rem">✉️ info@cabanaslospinos.com</a>
              <a href="https://wa.me/50688888888" style="color:var(--success); font-size:0.875rem" target="_blank">💬 WhatsApp</a>
            </div>
          </div>
        `;
      } catch (err) {
        Toast.error('Error al cargar la confirmación');
      }
    }

    document.getElementById('nav-logout')?.addEventListener('click', e => { e.preventDefault(); Auth.logout(); });
  </script>
</body>
</html>
