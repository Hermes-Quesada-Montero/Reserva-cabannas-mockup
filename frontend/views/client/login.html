<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Cabañas Los Pinos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { background: linear-gradient(135deg, var(--primary-dark) 0%, #1e4a0a 100%); min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .auth-card { background:white; border-radius:var(--radius-lg); padding:2.5rem; max-width:420px; width:100%; box-shadow:var(--shadow-xl); }
    .auth-logo { text-align:center; margin-bottom:2rem; }
    .auth-logo h1 { font-size:1.8rem; color:var(--primary); }
    .auth-logo p  { color:var(--text-muted); font-size:0.9rem; }
    .social-divider { display:flex; align-items:center; gap:1rem; margin:1.25rem 0; color:var(--text-muted); font-size:0.8rem; }
    .social-divider::before, .social-divider::after { content:''; flex:1; height:1px; background:var(--border); }
  </style>
</head>
<body>
  <div id="page-loader"><div class="loader-logo">🌲</div><div class="loader-spinner"></div></div>

  <div class="auth-card">
    <div class="auth-logo">
      <div style="font-size:2.5rem; margin-bottom:0.5rem">🌲</div>
      <h1>Cabañas Los Pinos</h1>
      <p>Inicia sesión en tu cuenta</p>
    </div>

    <div id="login-error" class="hidden alert alert-error">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span id="login-error-msg"></span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="identifier">Correo o usuario <span class="required">*</span></label>
        <input type="text" id="identifier" name="identifier" class="form-control" placeholder="correo@ejemplo.com" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña <span class="required">*</span></label>
        <div style="position:relative">
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" id="toggle-pass" style="position:absolute; right:1rem; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:0.85rem; background:none; border:none; cursor:pointer">Ver</button>
        </div>
      </div>
      <div class="d-flex align-center justify-between" style="margin-bottom:1.5rem">
        <label class="custom-check">
          <input type="checkbox" id="recordarme" name="recordarme">
          <span>Recordarme</span>
        </label>
        <a href="#" style="font-size:0.85rem; color:var(--primary)">¿Olvidaste tu contraseña?</a>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center" id="login-btn">
        <span class="btn-text">Iniciar Sesión</span>
      </button>
    </form>

    <div class="social-divider">o</div>

    <p style="text-align:center; font-size:0.9rem; color:var(--text-muted)">
      ¿No tienes cuenta?
      <a href="/registro" style="color:var(--primary); font-weight:700"> Crear cuenta gratis</a>
    </p>
    <p style="text-align:center; margin-top:1rem">
      <a href="/" style="font-size:0.85rem; color:var(--text-muted)">← Volver al inicio</a>
    </p>
  </div>

  <script src="/js/main.js"></script>
  <script>
    // Redirigir si ya está logueado
    Auth.check().then(loggedIn => {
      if (loggedIn) {
        const params = new URLSearchParams(window.location.search);
        const dest = params.get('redirect');
        if (dest) { window.location.href = dest; return; }
        window.location.href = Auth.isAdmin() ? '/admin' : '/';
      }
    });

    // Toggle password
    document.getElementById('toggle-pass').addEventListener('click', () => {
      const input = document.getElementById('password');
      const btn   = document.getElementById('toggle-pass');
      input.type  = input.type === 'password' ? 'text' : 'password';
      btn.textContent = input.type === 'password' ? 'Ver' : 'Ocultar';
    });

    // Submit login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('login-error');
      const errMsg = document.getElementById('login-error-msg');

      btn.disabled = true;
      btn.classList.add('btn-loading');
      err.classList.add('hidden');

      const data = {
        identifier:  document.getElementById('identifier').value.trim(),
        password:    document.getElementById('password').value,
        recordarme:  document.getElementById('recordarme').checked
      };

      try {
        const res = await API.post('/api/auth/login', data);
        if (!res || typeof res !== 'object') throw new Error('Respuesta inválida del servidor');
        if (res.success) {
          Toast.success('¡Bienvenido/a de vuelta!', res.message);
          const params = new URLSearchParams(window.location.search);
          const dest = params.get('redirect');
          setTimeout(() => {
            if (dest) { window.location.href = dest; return; }
            window.location.href = res.user?.rol === 'admin' ? '/admin' : '/';
          }, 800);
        } else {
          errMsg.textContent = res.message || 'Credenciales incorrectas';
          err.classList.remove('hidden');
          btn.disabled = false;
          btn.classList.remove('btn-loading');
        }
      } catch (loginErr) {
        errMsg.textContent = loginErr.message || 'Error de conexión. Intente de nuevo.';
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.classList.remove('btn-loading');
      }
    });
  </script>
</body>
</html>
