<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta | Cabañas Los Pinos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { background: linear-gradient(135deg, var(--primary-dark) 0%, #1e4a0a 100%); min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .auth-card { background:white; border-radius:var(--radius-lg); padding:2.5rem; max-width:480px; width:100%; box-shadow:var(--shadow-xl); }
  </style>
</head>
<body>
  <div id="page-loader"><div class="loader-logo">🌲</div><div class="loader-spinner"></div></div>
  <div class="auth-card">
    <div style="text-align:center; margin-bottom:2rem">
      <div style="font-size:2.5rem; margin-bottom:0.5rem">🏕️</div>
      <h1 style="font-size:1.8rem; color:var(--primary)">Crear Cuenta</h1>
      <p style="color:var(--text-muted); font-size:0.9rem">Únete a Cabañas Los Pinos</p>
    </div>

    <div id="reg-error" class="hidden alert alert-error">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span id="reg-error-msg"></span>
    </div>

    <form id="register-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="nombre">Nombre <span class="required">*</span></label>
          <input type="text" id="nombre" class="form-control" placeholder="Tu nombre" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="apellido">Apellido <span class="required">*</span></label>
          <input type="text" id="apellido" class="form-control" placeholder="Tu apellido" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico <span class="required">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="telefono">Teléfono</label>
        <input type="tel" id="telefono" class="form-control" placeholder="+506 8888-8888">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="reg-password">Contraseña <span class="required">*</span></label>
          <input type="password" id="reg-password" class="form-control" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmar-password">Confirmar <span class="required">*</span></label>
          <input type="password" id="confirmar-password" class="form-control" placeholder="Repetir contraseña" autocomplete="new-password" required>
        </div>
      </div>
      <div style="margin-bottom:1.5rem">
        <label class="custom-check">
          <input type="checkbox" id="terminos" required>
          <span>Acepto los <a href="/politicas" style="color:var(--primary)">términos y condiciones</a> y la <a href="/politicas#privacidad" style="color:var(--primary)">política de privacidad</a></span>
        </label>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center" id="register-btn">
        <span class="btn-text">Crear Cuenta Gratis</span>
      </button>
    </form>

    <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--text-muted)">
      ¿Ya tienes cuenta? <a href="/login" style="color:var(--primary); font-weight:700">Iniciar sesión</a>
    </p>
    <p style="text-align:center; margin-top:0.75rem">
      <a href="/" style="font-size:0.85rem; color:var(--text-muted)">← Volver al inicio</a>
    </p>
  </div>

  <script src="/js/main.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      const errDiv = document.getElementById('reg-error');
      const errMsg = document.getElementById('reg-error-msg');
      btn.disabled = true;
      btn.classList.add('btn-loading');
      errDiv.classList.add('hidden');

      const password = document.getElementById('reg-password').value;
      const confirmar = document.getElementById('confirmar-password').value;

      if (password !== confirmar) {
        errMsg.textContent = 'Las contraseñas no coinciden';
        errDiv.classList.remove('hidden');
        btn.disabled = false; btn.classList.remove('btn-loading');
        return;
      }

      try {
        const res = await API.post('/api/auth/register', {
          nombre:             document.getElementById('nombre').value.trim(),
          apellido:           document.getElementById('apellido').value.trim(),
          email:              document.getElementById('email').value.trim(),
          telefono:           document.getElementById('telefono').value.trim(),
          password,
          confirmar_password: confirmar
        });

        if (res.success) {
          Toast.success('¡Cuenta creada! Bienvenido/a.', '¡Registro exitoso!');
          const params = new URLSearchParams(window.location.search);
          setTimeout(() => { window.location.href = params.get('redirect') || '/mi-cuenta'; }, 800);
        } else {
          errMsg.textContent = res.message;
          errDiv.classList.remove('hidden');
          btn.disabled = false; btn.classList.remove('btn-loading');
        }
      } catch {
        errMsg.textContent = 'Error de conexión. Intente de nuevo.';
        errDiv.classList.remove('hidden');
        btn.disabled = false; btn.classList.remove('btn-loading');
      }
    });
  </script>
</body>
</html>
