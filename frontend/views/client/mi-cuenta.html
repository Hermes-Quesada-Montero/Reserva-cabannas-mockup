<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuenta | Cabañas Los Pinos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .cuenta-page { background:var(--bg); min-height:100vh; padding-top:var(--nav-height); }
    .cuenta-grid { display:grid; grid-template-columns:280px 1fr; gap:2rem; align-items:start; }
    .cuenta-sidebar { background:white; border-radius:var(--radius-lg); border:1px solid var(--border); overflow:hidden; position:sticky; top:calc(var(--nav-height)+1rem); }
    .sidebar-user { padding:2rem; text-align:center; background:linear-gradient(135deg,var(--primary),var(--primary-light)); color:white; }
    .sidebar-avatar { width:80px; height:80px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; font-size:2rem; font-weight:700; border:3px solid rgba(255,255,255,0.4); }
    .sidebar-menu { padding:0.5rem; }
    .sidebar-link { display:flex; align-items:center; gap:0.75rem; padding:0.75rem 1rem; border-radius:var(--radius-sm); color:var(--text-muted); font-size:0.9rem; transition:all var(--transition); cursor:pointer; text-decoration:none; background:none; border:none; width:100%; font-family:inherit; text-align:left; }
    .sidebar-link:hover, .sidebar-link.active { background:rgba(45,80,22,0.07); color:var(--primary); }
    .sidebar-link svg { width:18px; height:18px; flex-shrink:0; }
    @media(max-width:900px){ .cuenta-grid { grid-template-columns:1fr; } .cuenta-sidebar { position:static; } }
  </style>
</head>
<body>
  <div id="page-loader"><div class="loader-logo">🌲</div><div class="loader-spinner"></div></div>
  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo"><svg viewBox="0 0 40 40"><path d="M20 4 L36 30 L4 30 Z" opacity="0.9" fill="currentColor"/><rect x="17" y="30" width="6" height="6" rx="1" fill="currentColor"/></svg>Cabañas <span>Los Pinos</span></a>
      <div class="nav-links"><a href="/">Inicio</a><a href="/cabanas">Cabañas</a><a href="/reservar" class="btn btn-accent btn-sm">Reservar</a>
        <div id="nav-user" class="nav-user-menu"><button class="nav-user-btn" id="nav-user-btn"><div class="avatar" id="nav-avatar">U</div><span id="nav-user-name">Usuario</span></button><div class="nav-dropdown" id="nav-dropdown"><a href="/mi-cuenta">Mi Cuenta</a><a href="/mi-cuenta/reservaciones">Mis Reservaciones</a><hr><a href="#" id="nav-logout">Cerrar Sesión</a></div></div>
      </div>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>
  <div class="mobile-nav" id="mobile-nav"><a href="/">Inicio</a><a href="/cabanas">Cabañas</a><a href="/mi-cuenta" class="active">Mi Cuenta</a></div>

  <div class="cuenta-page">
    <div class="container" style="padding-top:2rem; padding-bottom:4rem">
      <div class="cuenta-grid">
        <!-- Sidebar -->
        <div class="cuenta-sidebar">
          <div class="sidebar-user">
            <div class="sidebar-avatar" id="profile-avatar">U</div>
            <div style="font-weight:700; font-size:1.1rem" id="profile-name">Cargando...</div>
            <div style="font-size:0.8rem; opacity:0.8" id="profile-email"></div>
          </div>
          <div class="sidebar-menu">
            <button class="sidebar-link active" id="menu-perfil" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Mi Perfil
            </button>
            <a href="/mi-cuenta/reservaciones" class="sidebar-link" id="menu-reservaciones">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              Mis Reservaciones
            </a>
            <button class="sidebar-link" id="menu-mensajes-cliente" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              Mis Mensajes
            </button>
            <button class="sidebar-link" id="menu-password" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              Cambiar Contraseña
            </button>
            <hr style="margin:0.5rem; border:none; border-top:1px solid var(--border)">
            <button class="sidebar-link" id="menu-logout" type="button" style="color:var(--error);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Cerrar Sesión
            </button>
          </div>
        </div>

        <!-- Contenido -->
        <div id="tab-content">
          <!-- Perfil -->
          <div id="tab-perfil">
            <div style="background:white; border-radius:var(--radius-lg); padding:2rem; border:1px solid var(--border); box-shadow:var(--shadow-sm)">
              <h2 style="margin-bottom:1.5rem; font-size:1.4rem">Mi Perfil</h2>
              <form id="perfil-form">
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Nombre <span class="required">*</span></label>
                    <input type="text" id="p-nombre" class="form-control" required>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Apellido <span class="required">*</span></label>
                    <input type="text" id="p-apellido" class="form-control" required>
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" id="p-email" class="form-control" disabled style="background:var(--bg)">
                    <p class="form-hint">El correo no puede cambiarse</p>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Teléfono</label>
                    <input type="tel" id="p-telefono" class="form-control" placeholder="+506 8888-8888">
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Identificación</label>
                    <input type="text" id="p-identificacion" class="form-control" placeholder="Cédula / Pasaporte">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Fecha de nacimiento</label>
                    <input type="date" id="p-nacimiento" class="form-control">
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Sexo</label>
                    <select id="p-sexo" class="form-control">
                      <option value="">Seleccionar</option>
                      <option value="M">Masculino</option>
                      <option value="F">Femenino</option>
                      <option value="Otro">Otro</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Nacionalidad</label>
                    <input type="text" id="p-nacionalidad" class="form-control" placeholder="Costarricense">
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Ciudad</label>
                    <input type="text" id="p-ciudad" class="form-control" placeholder="San José">
                  </div>
                  <div class="form-group">
                    <label class="form-label">País</label>
                    <input type="text" id="p-pais" class="form-control" placeholder="Costa Rica">
                  </div>
                </div>
                <button type="submit" class="btn btn-primary" id="btn-save-perfil">
                  <span class="btn-text">Guardar cambios</span>
                </button>
              </form>
            </div>
          </div>

          <!-- Mis Mensajes -->
          <div id="tab-mensajes-cliente" class="hidden">
            <div style="background:white;border-radius:var(--radius-lg);padding:2rem;border:1px solid var(--border);box-shadow:var(--shadow-sm)">
              <h2 style="margin-bottom:1.5rem;font-size:1.4rem">Mis Mensajes</h2>
              <div id="mis-mensajes-list">
                <p style="text-align:center;color:var(--text-muted);padding:3rem 0">Cargando mensajes...</p>
              </div>
            </div>
          </div>

          <!-- Cambiar contraseña -->
          <div id="tab-password" class="hidden">
            <div style="background:white; border-radius:var(--radius-lg); padding:2rem; border:1px solid var(--border); box-shadow:var(--shadow-sm)">
              <h2 style="margin-bottom:1.5rem; font-size:1.4rem">Cambiar Contraseña</h2>
              <form id="password-form" style="max-width:400px">
                <div class="form-group">
                  <label class="form-label">Contraseña actual <span class="required">*</span></label>
                  <input type="password" id="pass-actual" class="form-control" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Nueva contraseña <span class="required">*</span></label>
                  <input type="password" id="pass-nuevo" class="form-control" placeholder="Mínimo 6 caracteres" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Confirmar nueva contraseña <span class="required">*</span></label>
                  <input type="password" id="pass-confirmar" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" id="btn-save-pass">
                  <span class="btn-text">Actualizar contraseña</span>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de confirmación de cierre de sesión -->
  <div id="modal-logout-confirm" class="modal-overlay">
    <div class="modal" style="max-width:380px">
      <div class="modal-header">
        <h3 class="modal-title">Cerrar Sesión</h3>
        <button class="modal-close" data-dismiss="modal">✕</button>
      </div>
      <div class="modal-body" style="text-align:center; padding:2rem">
        <div style="font-size:2.5rem; margin-bottom:1rem">🚪</div>
        <p style="margin-bottom:1.5rem; color:var(--text-muted)">¿Estás seguro de que deseas cerrar sesión?</p>
        <div style="display:flex; gap:0.75rem; justify-content:center">
          <button class="btn btn-outline-primary" data-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" id="btn-confirmar-logout">Cerrar Sesión</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    // ── helpers ──────────────────────────────────────────────────
    function showTab(tab) {
      ['perfil', 'mensajes-cliente', 'password'].forEach(function(t) {
        var el  = document.getElementById('tab-' + t);
        var btn = document.getElementById('menu-' + t);
        if (el)  el.classList.toggle('hidden', t !== tab);
        if (btn) btn.classList.toggle('active', t === tab);
      });
      if (tab === 'mensajes-cliente') loadMisMensajes();
    }

    async function loadMisMensajes() {
      var cont = document.getElementById('mis-mensajes-list');
      cont.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem 0">Cargando...</p>';
      try {
        var res = await API.get('/api/mis-mensajes');
        if (!res.success) {
          cont.innerHTML = '<p style="text-align:center;color:var(--error);padding:2rem 0">' + (res.message || 'Error al cargar mensajes') + '</p>';
          return;
        }
        if (!res.data || !res.data.length) {
          cont.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem 0">No has enviado mensajes aún. Puedes contactarnos desde la página de <a href="/contacto">Contacto</a>.</p>';
          return;
        }
        cont.innerHTML = res.data.map(function(m) {
          var fecha = new Date(m.creado_en).toLocaleDateString('es-CR', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
          // Lógica 100% segura para detectar si fue respondido
          var esRespondido = m.respondido === 1 || String(m.estado).toLowerCase() === 'respondido';
          var badgeColor = esRespondido ? '#15803d' : '#d97706';
          var badgeBg    = esRespondido ? '#dcfce7'  : '#fef3c7';
          var badgeLabel = esRespondido ? '✅ Respondido' : '⏳ Pendiente';
          var respuestaHtml = (esRespondido && m.respuesta_admin)
            ? '<div style="margin-top:.75rem;background:#f0fdf4;border-left:3px solid #15803d;padding:.75rem 1rem;border-radius:0 6px 6px 0;font-size:.875rem">'
              + '<div style="font-size:.75rem;color:#15803d;font-weight:700;margin-bottom:.25rem">✅ Respuesta del equipo'
              + (m.respondido_en ? ' &nbsp;·&nbsp; ' + new Date(m.respondido_en).toLocaleDateString('es-CR', {day:'2-digit',month:'short',year:'numeric'}) : '')
              + '</div>'
              + '<div style="color:#166534;line-height:1.6">' + escHtml(m.respuesta_admin) + '</div>'
              + '</div>'
            : '<div style="margin-top:.5rem;font-size:.8rem;color:#9ca3af;font-style:italic">Pendiente de respuesta por parte de nuestro equipo...</div>';
          return '<div style="border:1px solid ' + (esRespondido ? '#bbf7d0' : '#e5e7eb') + ';border-radius:10px;padding:1.25rem;margin-bottom:1rem">'
            + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;flex-wrap:wrap">'
            +   '<div style="font-weight:700;font-size:.95rem">' + escHtml(m.asunto || 'Consulta general') + '</div>'
            +   '<span style="font-size:.75rem;font-weight:600;padding:.25rem .7rem;border-radius:99px;background:' + badgeBg + ';color:' + badgeColor + '">' + badgeLabel + '</span>'
            + '</div>'
            + '<div style="font-size:.75rem;color:#9ca3af;margin:.25rem 0 .75rem">' + fecha + '</div>'
            + '<div style="font-size:.875rem;color:#374151;line-height:1.6;padding:.75rem;background:#f9fafb;border-radius:6px">' + escHtml(m.mensaje) + '</div>'
            + respuestaHtml
            + '</div>';
        }).join('');
      } catch(e) {
        cont.innerHTML = '<p style="text-align:center;color:var(--error);padding:2rem 0">Error al cargar mensajes.</p>';
      }
    }

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadPerfil() {
      try {
        var res = await API.get('/api/perfil');
        if (!res.success) return;
        var u = res.data;
        document.getElementById('profile-name').textContent  = u.nombre + ' ' + u.apellido;
        document.getElementById('profile-email').textContent = u.email;
        document.getElementById('profile-avatar').textContent = u.nombre[0].toUpperCase();
        document.getElementById('p-nombre').value        = u.nombre        || '';
        document.getElementById('p-apellido').value      = u.apellido      || '';
        document.getElementById('p-email').value         = u.email         || '';
        document.getElementById('p-telefono').value      = u.telefono      || '';
        document.getElementById('p-identificacion').value = u.identificacion || '';
        document.getElementById('p-nacimiento').value    = u.fecha_nacimiento || '';
        document.getElementById('p-sexo').value          = u.sexo          || '';
        document.getElementById('p-nacionalidad').value  = u.nacionalidad  || '';
        document.getElementById('p-ciudad').value        = u.ciudad        || '';
        document.getElementById('p-pais').value          = u.pais          || '';
      } catch (err) {
        Toast.error('Error al cargar perfil');
      }
    }

    // ── Sidebar buttons ──────────────────────────────────────────
    document.getElementById('menu-perfil').addEventListener('click', function() {
      showTab('perfil');
    });

    document.getElementById('menu-mensajes-cliente').addEventListener('click', function() {
      showTab('mensajes-cliente');
    });

    document.getElementById('menu-password').addEventListener('click', function() {
      showTab('password');
    });

    document.getElementById('menu-logout').addEventListener('click', function() {
      Modal.open('modal-logout-confirm');
    });

    // ── Modal logout ─────────────────────────────────────────────
    document.getElementById('btn-confirmar-logout').addEventListener('click', function() {
      Modal.close('modal-logout-confirm');
      Auth.logout();
    });

    document.getElementById('nav-logout').addEventListener('click', function(e) {
      e.preventDefault();
      Modal.open('modal-logout-confirm');
    });

    // ── Guardar perfil ───────────────────────────────────────────
    document.getElementById('perfil-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('btn-save-perfil');
      btn.disabled = true;
      btn.classList.add('btn-loading');
      try {
        var res = await API.put('/api/perfil', {
          nombre:           document.getElementById('p-nombre').value.trim(),
          apellido:         document.getElementById('p-apellido').value.trim(),
          telefono:         document.getElementById('p-telefono').value.trim(),
          identificacion:   document.getElementById('p-identificacion').value.trim(),
          fecha_nacimiento: document.getElementById('p-nacimiento').value,
          sexo:             document.getElementById('p-sexo').value,
          nacionalidad:     document.getElementById('p-nacionalidad').value.trim(),
          ciudad:           document.getElementById('p-ciudad').value.trim(),
          pais:             document.getElementById('p-pais').value.trim()
        });
        if (res.success) { Toast.success(res.message); loadPerfil(); }
        else Toast.error(res.message || 'Error al guardar');
      } catch (err) {
        Toast.error('Error al guardar perfil');
      }
      btn.disabled = false;
      btn.classList.remove('btn-loading');
    });

    // ── Cambiar contraseña ────────────────────────────────────────
    document.getElementById('password-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn    = document.getElementById('btn-save-pass');
      var nuevo  = document.getElementById('pass-nuevo').value;
      var conf   = document.getElementById('pass-confirmar').value;
      if (nuevo !== conf) {
        Toast.warning('Las contraseñas no coinciden');
        return;
      }
      btn.disabled = true;
      btn.classList.add('btn-loading');
      try {
        var res = await API.post('/api/auth/change-password', {
          password_actual:    document.getElementById('pass-actual').value,
          password_nuevo:     nuevo,
          confirmar_password: conf
        });
        if (res.success) {
          Toast.success(res.message || 'Contraseña actualizada');
          e.target.reset();
        } else {
          Toast.error(res.message || 'Error al cambiar contraseña');
        }
      } catch (err) {
        Toast.error('Error al cambiar contraseña');
      }
      btn.disabled = false;
      btn.classList.remove('btn-loading');
    });

    // ── Verificar autenticación y cargar datos ────────────────────
    Auth.check().then(function(loggedIn) {
      if (!loggedIn) {
        window.location.href = '/login?redirect=/mi-cuenta';
      } else {
        loadPerfil();
      }
    });
  </script>
</body>
</html>
